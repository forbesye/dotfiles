"$schema" = 'https://starship.rs/config-schema.json'

# ── Custom warm two-line prompt ─────────────────────────────
# Blank line before each prompt for breathing room
add_newline = true
palette = "warm"

# First line:  directory  git ......(fill)...... status  duration  clock
# Second line: prompt character
format = """
$directory\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$time\
$line_break\
$character"""

[palettes.warm]
gold   = "#f9e2af"
peach  = "#fab387"
orange = "#ff9e64"
red    = "#f38ba8"
maroon = "#eba0ac"
muted  = "#d0a070"
green  = "#a6e3a1"

[fill]
symbol = " "

[directory]
style = "bold gold"
# Full absolute path (0 = no truncation), no repo-relative shortening
truncation_length = 0
truncate_to_repo = false
truncation_symbol = ""
use_os_path_sep = true
read_only = "  "
read_only_style = "red"
format = "[ $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold peach"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ ⇡${ahead_count} ⇣${behind_count} "
up_to_date = ""
untracked = "? "
stashed = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[status]
disabled = false
style = "bold red"
symbol = "✗ "
success_symbol = ""
not_executable_symbol = "🚫 "
not_found_symbol = "🔍 "
sigint_symbol = "🧱 "
signal_symbol = "⚡ "
format = "[$symbol$common_meaning$signal_name$maybe_int]($style)"

[cmd_duration]
min_time = 2_000
style = "italic maroon"
format = "[  $duration]($style) "

[time]
disabled = false
time_format = "%R"
style = "dimmed gold"
format = "[  $time]($style)"

[character]
success_symbol = "[❯](bold gold)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
